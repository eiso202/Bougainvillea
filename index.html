      [[825,1050],[799,1000],[777,966],[748,934]],
      [[818,1198],[786,1168],[771,1163],[735,1167]],
      [[891,1150],[949,940],[1033,782],[1130,677]],
      [[944,990],[1050,816],[1174,731],[1368,750]],
      [[904,1106],[1019,845],[1243,908],[1326,1118]],
      [[901,1175],[921,1120],[950,1079],[990,1052]]

    const flowers=[],falling=[]; const DOT_RADIUS=38; let drag=null, first=true, hover=-1;
    const backdrop=document.querySelector('#backdrop'),backCtx=backdrop.getContext('2d');
    const reference=document.querySelector('#reference');
    let branchLayers=null,cleanBackground=null;
    const stage=document.querySelector('#stage'),birdCursor=document.querySelector('#bird-cursor');
    let birdReady=false;
    function prepareBird(){
      const bird=new Image();bird.onload=()=>{
        const bc=birdCursor.getContext('2d',{willReadFrequently:true});
        bc.drawImage(bird,596,338,734,621,0,0,734,621);
        const data=bc.getImageData(0,0,734,621),pixels=data.data,seen=new Uint8Array(734*621),queue=[];

    }
    function moveBird(e){if(!birdReady||e.pointerType==='touch')return;const r=stage.getBoundingClientRect();birdCursor.style.left=(e.clientX-r.left)+'px';birdCursor.style.top=(e.clientY-r.top)+'px';birdCursor.classList.add('visible');stage.classList.add('bird-ready')}

    stage.addEventListener('pointerleave',()=>{birdCursor.classList.remove('visible');stage.classList.remove('bird-ready')});
    let sound=null;
    function ensureSound(){

    }
    function playBird(){
      const s=ensureSound();if(!s)return;const {ac,master}=s,t=ac.currentTime;if(t-s.lastChirp<.24)return;s.lastChirp=t;

    function rustleLeaves(speed=0){
      const s=sound;if(!s)return;const t=s.ac.currentTime,g=s.rustle.gain;
      if(g.cancelAndHoldAtTime)g.cancelAndHoldAtTime(t);else{g.cancelScheduledValues(t);g.setValueAtTime(g.value,t)}

    }
    document.addEventListener('visibilitychange',()=>{if(document.hidden){rustleLeaves();sound?.ac.suspend().catch(()=>{})}});
    const cubic=(p,t)=>{const u=1-t;return {x:u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],y:u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1]}};
    const pos=(ci,t)=>{
      const base=cubic(curves[ci],t);if(!drag||drag.ci!==ci||!drag.nodes)return base;
      const nodes=drag.nodes,last=nodes.length-1,u=Math.min(last,t*last),i=Math.min(last-1,Math.floor(u)),f=u-i;
      const sample=axis=>{const a=nodes[Math.max(0,i-1)][axis],b=nodes[i][axis],c=nodes[i+1][axis],d=nodes[Math.min(last,i+2)][axis];return .5*((2*b)+(-a+c)*f+(2*a-5*b+4*c-d)*f*f+(-a+3*b-3*c+d)*f*f*f)};
      return{x:base.x+sample('x'),y:base.y+sample('y')};
    };
    // A chain of masses transfers motion along the branch instead of moving it as one rigid arc.
    function stepBranch(dt){
      if(!drag?.prepared)return;
      const d=drag,n=d.nodes,last=n.length-1,steps=Math.max(1,Math.ceil(dt/.006)),h=dt/steps;
      for(let step=0;step<steps;step++){
        const forces=n.map((p,i)=>{
          if(i===0)return{x:0,y:0};const prev=n[i-1],next=n[Math.min(last,i+1)];
          return{x:1350*(prev.x+next.x-2*p.x)-14*p.x-5.8*p.vx,y:1350*(prev.y+next.y-2*p.y)-14*p.y-5.8*p.vy};
        });
        for(let i=1;i<=last;i++){
          const p=n[i];if(i===last&&!d.releasing){p.x=d.offset.x;p.y=d.offset.y;continue;}
          p.vx+=forces[i].x*h;p.vy+=forces[i].y*h;p.x+=p.vx*h;p.y+=p.vy*h;
        }
      }
      if(d.releasing){d.elapsed+=dt;const movement=Math.max(...n.map(p=>Math.hypot(p.x,p.y)+Math.hypot(p.vx,p.vy)*.2));if(d.elapsed>.8&&movement<1.5){drag=null;restoreBackground();canvas.classList.remove('dragging')}}
    }
    const pointer=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
    function nearest(q){let best={d:Infinity,ci:-1,t:0};curves.forEach((c,ci)=>{for(let i=0;i<=100;i++){const t=i/100,p=pos(ci,t),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<best.d)best={d,ci,t}}});return best}
    function prepareBranchLayers(){
      const image=new Image();
      image.onload=()=>{
        const surface=document.createElement('canvas');surface.width=W;surface.height=H;
        const context=surface.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);
        const original=context.getImageData(0,0,W,H),pixels=original.data;
        const mask=new Uint8Array(W*H),seeds=[];
        const sx=W/1368,sy=H/1824;
        // Separate only pale yellow branches; the pole and pedestrian signal remain untouched.
        for(let y=Math.floor(470*sy);y<Math.ceil(1220*sy);y++)for(let x=Math.floor(350*sx);x<W;x++){
          if(y>990*sy&&x>810*sx&&x<901*sx)continue;
          const k=(y*W+x)*4;
          if(pixels[k]>140&&pixels[k+1]>180&&pixels[k]-pixels[k+2]>-12&&pixels[k+1]-pixels[k+2]>24)seeds.push(y*W+x);
        }
        for(const k of seeds){const x=k%W,y=Math.floor(k/W);for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(x+dx>=0&&x+dx<W)mask[(y+dy)*W+x+dx]=1;}
        const buckets=new Map(),cell=64;
        curves.forEach((curve,ci)=>{for(let i=0;i<=200;i++){const p=cubic(curve,i/200),key=Math.floor(p.x/cell)+','+Math.floor(p.y/cell);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push({...p,ci});}});
        const records=curves.map(()=>[]),clean=context.createImageData(W,H);clean.data.set(pixels);
        for(let y=Math.floor(469*sy);y<Math.ceil(1222*sy);y++)for(let x=Math.floor(349*sx);x<W;x++){
          const k=y*W+x;if(!mask[k])continue;
          let best=Infinity,ci=0;
          const bx=Math.floor(x/cell),by=Math.floor(y/cell);
          for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)for(const p of buckets.get((bx+dx)+','+(by+dy))||[]){const d=(p.x-x)**2+(p.y-y)**2;if(d<best){best=d;ci=p.ci;}}

          let samples=0,r=0,g=0,b=0;
          for(let radius=4;radius<=28&&samples<2;radius+=4)for(const [dx,dy] of [[radius,0],[-radius,0],[0,radius],[0,-radius]]){
            const px=x+dx,py=y+dy;if(px<0||px>=W||py<0||py>=H)continue;const j=py*W+px,s=j*4;
            if(!mask[j]&&(pixels[s+2]>pixels[s]+22||pixels[s]+pixels[s+1]+pixels[s+2]<120)){r+=pixels[s];g+=pixels[s+1];b+=pixels[s+2];samples++;}
          }
          if(samples){clean.data[k*4]=r/samples;clean.data[k*4+1]=g/samples;clean.data[k*4+2]=b/samples;}
        }
        context.putImageData(clean,0,0);cleanBackground=surface;
        branchLayers=records.map(indices=>{
          const layer=document.createElement('canvas');if(!indices.length)return layer;
          let x0=W,y0=H,x1=0,y1=0;for(const k of indices){const x=k%W,y=Math.floor(k/W);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
          layer.width=x1-x0+1;layer.height=y1-y0+1;layer.origin={x:x0,y:y0};
          const lc=layer.getContext('2d'),data=lc.createImageData(layer.width,layer.height);
          for(const k of indices){const j=((Math.floor(k/W)-y0)*layer.width+k%W-x0)*4;data.data.set(pixels.subarray(k*4,k*4+4),j);}
          lc.putImageData(data,0,0);return layer;
        });
      };
      image.src=window.bougainvilleaReference;
    }
    function showDraggedBackground(ci){
      if(!branchLayers)return;
      backCtx.clearRect(0,0,W,H);backCtx.drawImage(cleanBackground,0,0);
      branchLayers.forEach((layer,i)=>{if(i!==ci&&layer.origin)backCtx.drawImage(layer,layer.origin.x,layer.origin.y)});
    }
    function restoreBackground(){backCtx.clearRect(0,0,W,H)}
    function bloom(q){
      const count=3+Math.floor(Math.random()*7),angle=Math.random()*Math.PI*2;
      const firstColor=Math.floor(Math.random()*colors.length);
      for(let i=0;i<count;i++){
        const a=angle+i*2.4+(Math.random()-.5)*.8,spread=Math.sqrt(Math.random())*190;
        const x=q.x+Math.cos(a)*spread,y=q.y+Math.sin(a)*spread,n=nearest({x,y}),attached=n.d<260;

      }

      playBird();
    }
    function drawBranchOverlay(){if(!drag?.prepared)return;ctx.save();ctx.strokeStyle='#f4ffa0';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=80;i++){const p=pos(drag.ci,i/80);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.restore()}

    let press=null;
    canvas.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary)return;ensureSound();const q=pointer(e),n=nearest(q);press={id:e.pointerId,q,moved:false};canvas.setPointerCapture(e.pointerId);if(!drag&&branchLayers&&n.d<90&&n.t>.88){drag={ci:n.ci,t:n.t,start:q,offset:{x:0,y:0},nodes:Array.from({length:13},()=>({x:0,y:0,vx:0,vy:0})),velocity:0,last:q,lastTime:performance.now(),releasing:false,elapsed:0};canvas.classList.add('dragging')}});
    document.addEventListener('pointermove',e=>{if(press&&e.pointerId===press.id){const q=pointer(e),r=canvas.getBoundingClientRect();if(Math.hypot(q.x-press.q.x,q.y-press.q.y)*r.width/W>5)press.moved=true}});
    canvas.addEventListener('pointermove',e=>{const q=pointer(e);if(drag&&!drag.releasing){const now=performance.now(),dt=Math.max(8,now-drag.lastTime);if(Math.hypot(q.x-drag.start.x,q.y-drag.start.y)*canvas.getBoundingClientRect().width/W>5){press.moved=true;if(!drag.prepared){showDraggedBackground(drag.ci);drag.prepared=true;}drag.offset.x=q.x-drag.start.x;drag.offset.y=q.y-drag.start.y;}drag.velocity=Math.hypot(q.x-drag.last.x,q.y-drag.last.y)/dt;if(drag.prepared)rustleLeaves(drag.velocity);drag.last=q;drag.lastTime=now}});

  })();
